# Runs the fast test suite on every push and pull request (Phase 10). The eMARC parquet file is not in the
# repository, so the two tests that need it are skipped here; everything else (golden results, engine,
# controller, service, dashboard pages headless, synthetic city, meters, short-horizon forecast) runs.
name: tests

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check the installation
        working-directory: project
        run: python scripts/check_imports.py
      - name: Fast tests
        working-directory: project
        run: python -m pytest -m "not slow" -q
